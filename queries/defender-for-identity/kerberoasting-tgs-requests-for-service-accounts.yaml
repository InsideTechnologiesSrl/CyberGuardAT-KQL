id: b27bcadf-3692-5edf-8cc3-b8e81725d735
name: 'Kerberoasting — TGS Requests for Service Accounts'
description: |
  Detects mass Kerberos TGS requests for service accounts with RC4 encryption — the Kerberoasting technique used to obtain crackable hashes for offline password attacks (T1558.003).
group: defender-for-identity
tactics:
  - CredentialAccess
relevantTechniques: []
tags:
  - Hunting
version: 1.0.0
added: 2025-01-01
author: Silvio Di Benedetto
legacyId: mdi-3
query: |
  IdentityQueryEvents
  | where QueryType == "Kerberos"
  | where AdditionalFields has "RC4"
  | summarize RequestCount = count(), Services = make_set(TargetAccountDisplayName) by AccountDisplayName, DeviceName, bin(Timestamp, 1h)
  | where RequestCount > 5
  | order by RequestCount desc
