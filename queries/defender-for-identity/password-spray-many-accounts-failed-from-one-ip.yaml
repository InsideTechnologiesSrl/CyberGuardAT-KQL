id: 82c19bff-9bb0-5b73-bb57-5bb0ca2d8424
name: 'Password Spray — Many Accounts Failed from One IP'
description: |
  Password spray attack pattern: the same source IP failing authentication against many distinct accounts in a short window to avoid per-account lockout policies (T1110.003 — Brute Force: Password Spraying).
group: defender-for-identity
tactics:
  - CredentialAccess
  - InitialAccess
relevantTechniques: []
tags:
  - Hunting
version: 1.0.0
added: 2025-01-01
author: Silvio Di Benedetto
legacyId: mdi-5
query: |
  IdentityLogonEvents
  | where ActionType == "LogonFailed"
  | where LogonType in ("Network", "Interactive")
  | summarize FailedAccounts = dcount(AccountDisplayName), AccountList = make_set(AccountDisplayName), AttemptCount = count() by IPAddress, bin(Timestamp, 10m)
  | where FailedAccounts > 10
  | order by FailedAccounts desc
