id: a2a48bbd-1963-56dc-8212-577f05c89a82
name: 'M365 admin role assigned — privilege elevation'
description: |
  Monitors the assignment of administrative roles in Microsoft 365. Any role elevation should be verified and approved by the IAM team.
group: exchange-online
tactics:
  - PrivilegeEscalation
relevantTechniques: []
tags:
  - Investigation
version: 1.0.0
added: 2025-01-01
author: Silvio Di Benedetto
legacyId: o365-3
query: |
  AuditLogs
  | where TimeGenerated > ago(30d)
  | where OperationName == "Add member to role"
  | extend Actor = tostring(InitiatedBy.user.userPrincipalName), TargetUser = tostring(TargetResources[0].userPrincipalName)
  | project TimeGenerated, Actor, TargetUser
