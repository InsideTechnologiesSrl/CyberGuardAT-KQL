id: 8bd57e8f-40a7-5287-a21b-5d87ea7b865b
name: 'Azure AI — Credential theft correlated with Azure Activity (deployment/listKeys pattern)'
description: |
  Joins Azure AI credential theft alerts with Azure Activity operations — specifically Cognitive Services account deployment writes and listKeys actions — within a one-hour window. A credential theft alert followed by a listKeys action suggests potential exploitation: the attacker may have used credentials from the model response to access the Azure AI resource directly. If no matching activity is found, remediate the exposed credentials regardless. Expand the join window if your environment has higher ingestion latency.
group: copilot-ai
tactics:
  - CredentialAccess
  - InitialAccess
relevantTechniques:
  - T1552
  - T1078.004
tags: []
version: 1.0.0
added: 2026-06-15
author: Silvio Di Benedetto
legacyId: copilotai-7
query: |
  let AiAlerts = SecurityAlert
  | where AlertType == "AI.Azure_CredentialTheftAttempt"
  | project AlertTime = TimeGenerated, AlertName, AlertType,
            Severity, Entities, ExtendedProperties;
  AiAlerts
  | join kind=leftouter (
      AzureActivity
      | where OperationNameValue in (
          "Microsoft.CognitiveServices/accounts/write",
          "Microsoft.CognitiveServices/accounts/listKeys/action"
        )
      | project ActivityTime = TimeGenerated, OperationNameValue,
                Caller, ResourceGroup, ResourceId
    )
    on $left.AlertTime between ($right.ActivityTime .. $right.ActivityTime + 1h)
