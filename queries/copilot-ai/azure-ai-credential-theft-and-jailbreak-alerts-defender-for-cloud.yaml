id: bfff812b-78fa-56d5-b895-007bd8539f96
name: 'Azure AI — Credential theft and jailbreak alerts (Defender for Cloud)'
description: |
  Queries Defender for Cloud alerts specific to Azure AI services: credential theft attempts (credentials appeared in a model response) and jailbreak attempts blocked or detected by content filtering. These are higher-confidence signals than the M365 Copilot JailbreakDetected flag. Review Entities and ExtendedProperties for resource identifiers and actor details. Credential theft alerts are urgent — a model leaking credentials is an active exposure. Pivot to the Azure Activity correlation query to check for follow-on deployment or key-listing operations.
group: copilot-ai
tactics:
  - CredentialAccess
  - Exfiltration
  - DefenseEvasion
relevantTechniques: []
tags:
  - Hunting
version: 1.0.0
added: 2026-06-15
author: Silvio Di Benedetto
legacyId: copilotai-6
query: |
  SecurityAlert
  | where AlertType in (
      "AI.Azure_CredentialTheftAttempt",
      "AI.Azure_Jailbreak.ContentFiltering.BlockedAttempt",
      "AI.Azure_Jailbreak.ContentFiltering.DetectedAttempt"
    )
  | project TimeGenerated, AlertName, AlertType, Severity,
            Description, Entities, ExtendedProperties
