id: bdf335c1-d7a0-5a42-be62-b41e75f29c15
name: 'Service Account Interactive Logon'
description: |
  Service accounts used for interactive or RDP sessions — anomalous behavior indicating abuse of technical credentials for unauthorized human access (T1078.002 — Valid Accounts: Domain Accounts).
group: active-directory
tactics:
  - InitialAccess
  - PrivilegeEscalation
relevantTechniques: []
tags:
  - Hunting
version: 1.0.0
added: 2025-01-01
author: Silvio Di Benedetto
legacyId: login-4
query: |
  DeviceLogonEvents
  | where LogonType in ("Interactive", "RemoteInteractive")
  | where ActionType == "LogonSuccess"
  | where AccountName startswith "svc_" or AccountName startswith "sa_"
      or AccountName has "service" or AccountName has "svc"
  | project Timestamp, AccountName, DeviceName, LogonType, RemoteIP
  | order by Timestamp desc
