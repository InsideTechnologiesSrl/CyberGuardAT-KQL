id: b3a5c61b-7c69-5205-af97-c49da0a40148
name: 'Credential File Access by Unexpected Process'
description: |
  Reads of password manager databases, certificate files, or files containing "password" or "credential" by processes other than known password managers — local credential harvesting (T1555 — Credentials from Password Stores).
group: defender-for-endpoint
tactics:
  - CredentialAccess
relevantTechniques:
  - T1555.005
  - T1552.001
  - T1552.004
tags:
  - Hunting
version: 1.0.0
added: 2025-01-01
author: Silvio Di Benedetto
legacyId: file-5
query: |
  DeviceFileEvents
  | where ActionType == "FileRead"
  | where FileName endswith ".kdbx" or FileName has "password"
      or FileName has "credential" or FileName has "wallet"
      or FileName endswith ".pfx" or FileName endswith ".p12"
  | where InitiatingProcessFileName !in~ ("keepass.exe", "1password.exe", "bitwarden.exe")
  | extend AccountName = InitiatingProcessAccountName
  | project Timestamp, DeviceName, AccountName, FileName, FolderPath, InitiatingProcessFileName
  | order by Timestamp desc
