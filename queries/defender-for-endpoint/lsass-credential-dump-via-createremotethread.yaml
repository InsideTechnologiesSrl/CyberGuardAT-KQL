id: a508a2f4-ac53-521d-8234-4ad8909a9aaf
name: 'LSASS Credential Dump via CreateRemoteThread'
description: |
  Detects remote thread injection into lsass.exe — the standard technique used by Mimikatz and similar tools to extract password hashes from memory (T1003.001 — OS Credential Dumping: LSASS Memory).
group: defender-for-endpoint
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003.001
tags:
  - Hunting
version: 1.0.0
added: 2025-01-01
author: Silvio Di Benedetto
legacyId: mde-10
query: |
  DeviceEvents
  | where ActionType == "CreateRemoteThreadApiCall"
  | where FileName =~ "lsass.exe"
  | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine
  | order by Timestamp desc
