name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr.number,
              body: 'Thank you for your interest. This repository is fully managed by Inside Technologies and does not accept external contributions at the moment: see CONTRIBUTING.md.',
            });
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: 'closed' });
